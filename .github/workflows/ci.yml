name: CI and deploy preview
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Résumé must not contain a phone number
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null && npm run check:resume
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test  # automated, software-rendered (SwiftShader); not real devices
      - name: Lighthouse desktop
        run: LH_PRESET=desktop npx lhci autorun --config=lighthouserc.cjs
      - name: Lighthouse mobile
        run: LH_PRESET=mobile npx lhci autorun --config=lighthouserc.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports, path: "test-results\n.lighthouseci" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
